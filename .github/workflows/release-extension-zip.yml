# Собирает zip расширения (как для «Загрузить распакованное») и прикрепляет к GitHub Release.
# Сборка всегда с ветки main (актуальный manifest и scripts); тег задаёт только имя релиза.
name: Release extension zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v0.9.7.1)'
        required: true
        default: 'v0.9.7.1'

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Tag name for release
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main (extension sources + build scripts)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build zip
        run: bash scripts/build-release.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          files: dist/autotest-recorder-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
